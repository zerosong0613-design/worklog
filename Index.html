<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>법무 업무기록</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="법무기록">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #1a2844;
  --navy-light: #243356;
  --navy-dim: #1a284499;
  --amber: #c8873c;
  --amber-light: #e8a85a;
  --paper: #f5f3ef;
  --paper-dark: #ece9e2;
  --white: #ffffff;
  --text: #1e1e2e;
  --text-muted: #6b6b80;
  --border: #ddd9d1;
  --green: #2d7a5f;
  --green-bg: #e8f5ef;
  --red: #b54040;
  --red-bg: #fceaea;
  --blue: #2a5ba0;
  --blue-bg: #e8eef8;
  --orange: #b36a1a;
  --orange-bg: #fdf0e0;
  --shadow: 0 2px 12px rgba(26,40,68,0.09);
  --shadow-lg: 0 8px 32px rgba(26,40,68,0.14);
  --radius: 12px;
  --radius-sm: 7px;
  --sidebar-w: 220px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans KR', -apple-system, sans-serif;
  background: var(--paper);
  color: var(--text);
  min-height: 100vh;
}

/* ===================== PC LAYOUT ===================== */
.app-layout {
  display: flex;
  min-height: 100vh;
}

/* SIDEBAR */
.sidebar {
  width: var(--sidebar-w);
  background: var(--navy);
  min-height: 100vh;
  position: fixed;
  left: 0; top: 0;
  display: flex;
  flex-direction: column;
  z-index: 200;
  box-shadow: 2px 0 16px rgba(0,0,0,0.18);
}

.sidebar-brand {
  padding: 28px 24px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.brand-title {
  font-family: 'DM Serif Display', serif;
  font-size: 20px;
  color: #e8e0d0;
  line-height: 1.2;
}

.brand-sub {
  font-size: 10px;
  color: var(--amber-light);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-top: 4px;
  opacity: 0.85;
}

.sidebar-date {
  font-size: 11px;
  color: rgba(255,255,255,0.4);
  margin-top: 10px;
  font-weight: 300;
}

.sidebar-nav {
  padding: 16px 12px;
  flex: 1;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  border-radius: 9px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,0.55);
  transition: all 0.18s;
  margin-bottom: 2px;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  font-family: inherit;
}

.nav-item:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.85); }
.nav-item.active { background: rgba(200,135,60,0.18); color: var(--amber-light); font-weight: 700; }
.nav-item .nav-icon { font-size: 15px; flex-shrink: 0; }

.sidebar-footer {
  padding: 16px;
  border-top: 1px solid rgba(255,255,255,0.08);
}

.sidebar-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.sidebar-stat {
  background: rgba(255,255,255,0.06);
  border-radius: 8px;
  padding: 10px;
  text-align: center;
}

.sidebar-stat-num {
  font-size: 20px;
  font-weight: 700;
  color: white;
  line-height: 1;
}

.sidebar-stat-label {
  font-size: 9px;
  color: rgba(255,255,255,0.4);
  margin-top: 4px;
  letter-spacing: 0.5px;
}

/* MAIN CONTENT */
.main-content {
  margin-left: var(--sidebar-w);
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.main-header {
  background: white;
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}

.main-header-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--navy);
}

.main-body {
  padding: 28px 32px 60px;
  flex: 1;
}

/* 2-COLUMN GRID for record screen */
.two-col {
  display: grid;
  grid-template-columns: 380px 1fr;
  gap: 24px;
  align-items: start;
}

.col-left { }
.col-right { }

/* ===================== SCREENS ===================== */
.screen { display: none; }
.screen.active { display: block; }

/* ===================== CARDS ===================== */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: var(--shadow);
}

.card-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 6px;
  letter-spacing: 0.3px;
}

/* ===================== FORM ===================== */
.form-group { margin-bottom: 14px; }
.form-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 6px;
  display: block;
}

select, input[type="text"], input[type="date"], textarea {
  width: 100%;
  padding: 9px 12px;
  font-family: inherit;
  font-size: 13px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--paper);
  color: var(--text);
  transition: border-color 0.15s;
  outline: none;
  -webkit-appearance: none;
}

select:focus, input:focus, textarea:focus {
  border-color: var(--amber);
  background: white;
}

textarea { resize: vertical; min-height: 80px; line-height: 1.6; }

/* CAT PILLS */
.cat-pill-row { display: flex; gap: 7px; margin-bottom: 4px; }

.cat-pill {
  flex: 1;
  padding: 9px 4px;
  border: 2px solid var(--border);
  border-radius: 22px;
  background: var(--paper);
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  text-align: center;
  transition: all 0.18s;
  white-space: nowrap;
}

.cat-pill:hover { border-color: var(--amber); color: var(--amber); }
.cat-pill.active[data-cat="루틴업무"] { border-color: var(--blue); background: var(--blue); color: white; }
.cat-pill.active[data-cat="프로젝트"] { border-color: var(--green); background: var(--green); color: white; }
.cat-pill.active[data-cat="자율업무"] { border-color: var(--amber); background: var(--amber); color: white; }

/* STATUS PILLS */
.status-pill-row { display: flex; gap: 6px; }

.status-pill {
  flex: 1;
  padding: 8px 4px;
  border: 2px solid var(--border);
  border-radius: 22px;
  background: var(--paper);
  cursor: pointer;
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-align: center;
  transition: all 0.18s;
  display: flex; align-items: center; justify-content: center; gap: 4px;
  white-space: nowrap;
}

.status-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); flex-shrink: 0; transition: background 0.15s; }
.status-pill.active[data-status="진행중"] { border-color: var(--blue); background: var(--blue-bg); color: var(--blue); }
.status-pill.active[data-status="진행중"] .dot { background: var(--blue); }
.status-pill.active[data-status="완료"] { border-color: var(--green); background: var(--green-bg); color: var(--green); }
.status-pill.active[data-status="완료"] .dot { background: var(--green); }
.status-pill.active[data-status="이슈"] { border-color: var(--red); background: var(--red-bg); color: var(--red); }
.status-pill.active[data-status="이슈"] .dot { background: var(--red); }
.status-pill.active[data-status="다음주"] { border-color: var(--orange); background: var(--orange-bg); color: var(--orange); }
.status-pill.active[data-status="다음주"] .dot { background: var(--orange); }

/* SAVE BUTTON */
.btn-save {
  width: 100%;
  padding: 12px;
  background: var(--navy);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
  letter-spacing: 0.3px;
}

.btn-save:hover { background: var(--navy-light); }
.btn-save:active { transform: scale(0.99); }

/* LOG LIST */
.log-item {
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin-bottom: 8px;
  background: white;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  transition: border-color 0.15s;
}

.log-item:hover { border-color: var(--amber-light); }

.log-left { flex: 1; min-width: 0; }

.log-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 5px;
  flex-wrap: wrap;
}

.log-item-name { font-size: 13px; font-weight: 700; color: var(--text); }
.log-date { font-size: 11px; color: var(--text-muted); margin-left: auto; }

.log-memo {
  font-size: 12px;
  color: var(--text);
  line-height: 1.6;
  word-break: break-all;
  color: #444;
}

.log-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
.log-item:hover .log-actions { opacity: 1; }

.log-act-btn {
  width: 26px; height: 26px;
  border: none; border-radius: 4px;
  background: var(--paper-dark);
  cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}

.log-act-btn:hover { background: var(--border); }
.log-act-btn.del:hover { background: var(--red-bg); color: var(--red); }

/* BADGES */
.badge {
  display: inline-flex; align-items: center;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 700;
  white-space: nowrap;
}

.badge-루틴업무 { background: var(--blue-bg); color: var(--blue); }
.badge-프로젝트 { background: var(--green-bg); color: var(--green); }
.badge-자율업무 { background: var(--orange-bg); color: var(--orange); }
.badge-진행중 { background: var(--blue-bg); color: var(--blue); }
.badge-완료 { background: var(--green-bg); color: var(--green); }
.badge-이슈 { background: var(--red-bg); color: var(--red); }
.badge-다음주 { background: var(--orange-bg); color: var(--orange); }

/* STATS */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}

.stat-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px;
  text-align: center;
  box-shadow: var(--shadow);
}

.stat-num { font-size: 26px; font-weight: 700; color: var(--navy); line-height: 1; }
.stat-label { font-size: 10px; color: var(--text-muted); margin-top: 5px; font-weight: 500; letter-spacing: 0.3px; }

/* FILTER ROW */
.filter-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.filter-btn {
  padding: 5px 12px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: white;
  font-family: inherit;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
}

.filter-btn.active { background: var(--navy); color: white; border-color: var(--navy); }

/* EMPTY STATE */
.empty-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--text-muted);
  font-size: 13px;
}
.empty-state .empty-icon { font-size: 36px; margin-bottom: 10px; }

/* ITEM MANAGEMENT */
.cat-tab-row { display: flex; gap: 6px; margin-bottom: 18px; }

.cat-tab {
  padding: 8px 18px;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  background: white;
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
  transition: all 0.15s;
}

.cat-tab.active[data-cat="루틴업무"] { border-color: var(--blue); background: var(--blue-bg); color: var(--blue); font-weight: 700; }
.cat-tab.active[data-cat="프로젝트"] { border-color: var(--green); background: var(--green-bg); color: var(--green); font-weight: 700; }
.cat-tab.active[data-cat="자율업무"] { border-color: var(--amber); background: var(--orange-bg); color: var(--orange); font-weight: 700; }

.item-add-row { display: flex; gap: 8px; margin-bottom: 12px; }
.item-add-row input { flex: 1; }

.btn-add {
  padding: 9px 16px;
  background: var(--amber);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s;
}

.btn-add:hover { background: var(--amber-light); }

.item-list-entry {
  display: flex;
  align-items: center;
  padding: 10px 12px;
  background: var(--paper);
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
  border: 1px solid var(--border);
}

.item-list-entry .item-entry-name { flex: 1; font-size: 13px; font-weight: 500; }
.item-entry-count { font-size: 11px; color: var(--text-muted); margin-right: 8px; }

.item-edit-input {
  flex: 1;
  padding: 5px 9px;
  font-family: inherit;
  font-size: 13px;
  border: 1.5px solid var(--amber);
  border-radius: var(--radius-sm);
  background: white;
  color: var(--text);
  outline: none;
}

.btn-edit-item {
  width: 26px; height: 26px;
  border: none; border-radius: 4px;
  background: none; cursor: pointer;
  font-size: 12px; color: var(--text-muted);
  transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
}

.btn-edit-item:hover { background: var(--blue-bg); color: var(--blue); }

.btn-del-item {
  width: 26px; height: 26px;
  border: none; border-radius: 4px;
  background: none; cursor: pointer;
  font-size: 13px; color: var(--text-muted);
  transition: all 0.15s;
  display: flex; align-items: center; justify-content: center;
}

.btn-del-item:hover { background: var(--red-bg); color: var(--red); }

/* ITEMS 2-COL */
.items-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

/* REPORT */
.week-nav-card {
  background: var(--navy);
  border-radius: var(--radius);
  padding: 18px 24px;
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-lg);
}

.week-arrow {
  width: 38px; height: 38px;
  border: 1.5px solid rgba(255,255,255,0.22);
  border-radius: 8px;
  background: rgba(255,255,255,0.07);
  color: white;
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  flex-shrink: 0;
}

.week-arrow:hover:not(:disabled) { background: rgba(255,255,255,0.16); }
.week-arrow:disabled { opacity: 0.3; cursor: not-allowed; }

.week-nav-center { flex: 1; text-align: center; }
.week-label { font-size: 16px; font-weight: 700; color: white; margin-bottom: 3px; }
.week-range { font-size: 11px; color: rgba(255,255,255,0.5); }

.report-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  margin-bottom: 18px;
}

.week-sum-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: var(--shadow);
}

.week-sum-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.week-sum-num { font-size: 22px; font-weight: 700; color: var(--navy); line-height: 1; }
.week-sum-label { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

.report-output {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 20px;
  min-height: 200px;
  font-size: 12px;
  line-height: 1.8;
  white-space: pre-wrap;
  color: var(--text);
}

.btn-gen {
  padding: 9px 20px;
  background: var(--navy);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s;
}

.btn-gen:hover { background: var(--navy-light); }

.btn-copy {
  padding: 7px 16px;
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--text-muted);
}

.btn-copy:hover { background: var(--navy); color: white; border-color: var(--navy); }

/* BACKUP */
.backup-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  max-width: 600px;
}

.backup-card {
  background: white;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  cursor: pointer;
  transition: all 0.18s;
}

.backup-card:hover { border-color: var(--amber); box-shadow: var(--shadow); }
.backup-icon { font-size: 36px; margin-bottom: 10px; }
.backup-title { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 5px; }
.backup-desc { font-size: 11px; color: var(--text-muted); line-height: 1.5; }

/* EDIT PANEL */
.edit-panel {
  display: none;
  background: white;
  border: 1.5px solid var(--amber);
  border-radius: var(--radius);
  padding: 14px;
  margin-top: 6px;
}

.edit-panel.open { display: block; }
.btn-icon {
  padding: 8px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  background: white;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.15s;
}

.btn-icon:hover { border-color: var(--amber); background: var(--orange-bg); }

/* SECTION LABEL */
.section-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 10px;
}

/* RECENT CHIPS */
.recent-items { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.recent-chip {
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: white;
  font-size: 11px;
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
}
.recent-chip:hover { border-color: var(--amber); color: var(--amber); background: var(--orange-bg); }

/* TOAST */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--navy);
  color: white;
  padding: 10px 22px;
  border-radius: 24px;
  font-size: 13px;
  font-weight: 500;
  z-index: 9999;
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  white-space: nowrap;
  box-shadow: var(--shadow-lg);
}

.toast.show { transform: translateX(-50%) translateY(0); }

/* DIVIDER */
.divider { height: 1px; background: var(--border); margin: 14px 0; }

/* RECORD ROW HEADER */
.record-list-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

/* ===================== MOBILE LAYOUT ===================== */
/* Mobile top header (hidden on desktop) */
.mobile-header {
  display: none;
  background: var(--navy);
  color: white;
  padding: 0 20px;
  padding-top: env(safe-area-inset-top);
  height: calc(54px + env(safe-area-inset-top));
  align-items: flex-end;
  padding-bottom: 12px;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.mobile-brand {
  font-family: 'DM Serif Display', serif;
  font-size: 17px;
  color: #e8e0d0;
}

.mobile-date { font-size: 11px; color: rgba(255,255,255,0.45); }

/* Mobile bottom nav (hidden on desktop) */
.mobile-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: white;
  border-top: 1px solid var(--border);
  z-index: 200;
  padding-bottom: env(safe-area-inset-bottom);
  box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
}

.mobile-nav-inner {
  display: flex;
}

.mobile-nav-btn {
  flex: 1;
  padding: 10px 6px 8px;
  border: none;
  background: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 10px;
  color: var(--text-muted);
  font-weight: 500;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  transition: color 0.15s;
}

.mobile-nav-btn .m-icon { font-size: 20px; }
.mobile-nav-btn.active { color: var(--navy); font-weight: 700; }

/* FAB */
.fab {
  position: fixed;
  bottom: calc(70px + env(safe-area-inset-bottom));
  right: 20px;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: var(--amber);
  color: white;
  font-size: 26px;
  font-weight: 300;
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(200,135,60,0.45);
  display: none;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s, background 0.15s;
  z-index: 200;
  line-height: 1;
}

.fab:hover { background: var(--amber-light); transform: scale(1.07); }
.fab.open { transform: rotate(45deg); background: var(--text-muted); }

/* BOTTOM SHEET */
.sheet-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(10,16,30,0.45);
  z-index: 210;
}
.sheet-overlay.open { display: block; }

.bottom-sheet {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--white);
  border-radius: 20px 20px 0 0;
  padding: 0 20px 32px;
  max-height: 88vh;
  overflow-y: auto;
  z-index: 220;
  display: none;
  animation: slideUp 0.28s cubic-bezier(0.32, 0.72, 0, 1);
  box-shadow: 0 -4px 32px rgba(26,40,68,0.18);
}
.bottom-sheet.open { display: block; }

.sheet-handle {
  width: 40px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 12px auto 16px;
}

.sheet-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 18px;
  text-align: center;
}

/* iOS Banner */
.ios-banner {
  display: none;
  background: var(--navy);
  color: white;
  text-align: center;
  padding: 8px 16px;
  font-size: 12px;
  line-height: 1.5;
}
.ios-banner.show { display: block; }
.ios-banner strong { color: var(--amber-light); }

@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

/* ===================== RESPONSIVE BREAKPOINTS ===================== */
@media (max-width: 900px) {
  .sidebar { display: none; }
  .main-content { margin-left: 0; }
  .main-header { display: none; }
  .mobile-header { display: flex; }
  .mobile-nav { display: block; }
  .fab { display: flex; }
  .main-body { padding: 16px 14px 100px; }
  .two-col { grid-template-columns: 1fr; }
  .col-left .card { margin-bottom: 0; }
  /* 2x2 grid on mobile */
  .stats-row { grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
  .stat-num { font-size: 22px; }
  .items-grid { grid-template-columns: 1fr; }
  .report-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .backup-grid { grid-template-columns: 1fr; }
  /* Hide form card on mobile — use bottom sheet instead */
  .col-left { display: none; }
  .col-right .section-label { margin-top: 0; }
}

@media (max-width: 500px) {
  .stats-row { grid-template-columns: repeat(3, 1fr); }
  .week-nav-card { padding: 14px 16px; }
  .week-label { font-size: 14px; }
}

/* Desktop: PC-only add button */
.pc-add-btn {
  padding: 9px 18px;
  background: var(--amber);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s;
}
.pc-add-btn:hover { background: var(--amber-light); }

@media (max-width: 900px) {
  .pc-add-btn { display: none; }
}

/* Scroll container */
.log-scroll {
  max-height: calc(100vh - 240px);
  overflow-y: auto;
  padding-right: 2px;
}

@media (max-width: 900px) {
  .log-scroll { max-height: none; }
}
</style>
</head>
<body>

</div>

<!-- APP LAYOUT -->
<div class="app-layout">

  <!-- SIDEBAR (PC) -->
  <aside class="sidebar">
    <div class="sidebar-brand">

    <nav class="sidebar-nav">

    <div class="sidebar-footer">

        <div class="sidebar-stat"><div class="sidebar-stat-num" id="ssStat4">0</div><div class="sidebar-stat-label">이번 주</div></div>
      </div>

  </aside>

  <!-- MAIN CONTENT -->
  <div class="main-content">

    <!-- PC TOP BAR -->
    <div class="main-header">
      <div class="main-header-title" id="pcHeaderTitle">✏️ 업무 기록</div>

    <div class="main-body">

      <div class="screen active" id="screen-record">

        <div class="two-col">
          <!-- LEFT: Form (PC only) -->
          <div class="col-left">

                  <button class="status-pill active" data-status="완료" onclick="selectStatus(this,'pc')"><span class="dot"></span>완료</button>

              <div class="form-group">

          <!-- RIGHT: Log List -->

              <div class="section-label" style="margin:0">기록 목록</div>
              <div class="filter-row" style="margin:0">
                <button class="filter-btn active" data-filter="all" onclick="filterLogs(this)">전체</button>
                <button class="filter-btn" data-filter="루틴업무" onclick="filterLogs(this)">루틴</button>
                <button class="filter-btn" data-filter="프로젝트" onclick="filterLogs(this)">프로젝트</button>
                <button class="filter-btn" data-filter="자율업무" onclick="filterLogs(this)">자율</button>
                <button class="filter-btn" data-filter="이슈" onclick="filterLogs(this)">이슈</button>

    </button>

    </button>

<!-- BOTTOM SHEET (mobile form) -->
<div class="bottom-sheet" id="bottomSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">📝 새 기록 작성</div>

  <div class="form-group">
    <div class="form-label">분류</div>
    <div class="cat-pill-row">
      <button class="cat-pill" data-cat="루틴업무" onclick="selectCat(this,'mob')">📌 루틴</button>
      <button class="cat-pill" data-cat="프로젝트" onclick="selectCat(this,'mob')">🗂 프로젝트</button>
      <button class="cat-pill" data-cat="자율업무" onclick="selectCat(this,'mob')">💡 자율</button>
    </div>
  </div>

  <div class="form-group">
    <div class="form-label">항목</div>
    <select id="mobItemSelect">
      <option value="">— 분류를 먼저 선택하세요 —</option>
    </select>
    <div class="recent-items" id="mobRecentChips"></div>
  </div>

  <div class="form-group">
    <div class="form-label">내용</div>
    <textarea id="mobLogMemo" placeholder="업무 내용을 간략히 메모하세요..." rows="3"></textarea>
  </div>

  <div class="form-group">
    <div class="form-label">상태</div>
    <div class="status-pill-row">
      <button class="status-pill" data-status="진행중" onclick="selectStatus(this,'mob')"><span class="dot"></span>진행중</button>
      <button class="status-pill active" data-status="완료" onclick="selectStatus(this,'mob')"><span class="dot"></span>완료</button>
      <button class="status-pill" data-status="이슈" onclick="selectStatus(this,'mob')"><span class="dot"></span>이슈</button>
      <button class="status-pill" data-status="다음주" onclick="selectStatus(this,'mob')"><span class="dot"></span>다음주</button>
    </div>
  </div>

  <div class="form-group">
    <div class="form-label">날짜</div>
    <input type="date" id="mobLogDate">
  </div>

  <button class="btn-save" onclick="saveLog('mob')">저장</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== DATA =====
let db = {
  categories: {
    "루틴업무": ["NDA 검토", "공급계약 검토", "인사노무 자문", "표시광고 검토"],
    "프로젝트": ["컴플라이언스 점검체계 구축", "내부통제 고도화"],
    "자율업무": ["AI 법무 자동화 정리", "표준계약서 리뉴얼", "법무 KPI 설계"]
  },
  logs: []
};

let selectedCatPC = null;
let selectedStatusPC = '완료';
let selectedCatMob = null;
let selectedStatusMob = '완료';
let currentLogFilter = 'all';
let currentItemTab = '루틴업무';
let editingLogId = null;
let editingItemIdx = null;

// ===== LOAD / SAVE =====
function loadDB() {
  const raw = localStorage.getItem('legalWorkLog_v1');
  if (raw) { try { db = JSON.parse(raw); } catch(e) {} }
}

function saveDB() {
  localStorage.setItem('legalWorkLog_v1', JSON.stringify(db));
}

// ===== UTILS =====
function todayStr() { return new Date().toISOString().split('T')[0]; }
function fmtDate(d) { return d.toISOString().split('T')[0]; }

function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ===== INIT =====
function init() {
  loadDB();
  updateDates();
  renderStats();
  renderSidebarStats();
  renderLogList();
  renderItemsGrid();
  initReportDates();
  renderSummaryStats();

  document.getElementById('pcLogDate').value = todayStr();
  document.getElementById('mobLogDate').value = todayStr();

  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.navigator.standalone === true;
  if (isIOS && !isStandalone) {
    document.getElementById('iosBanner').classList.add('show');
  }
}

function updateDates() {
  const d = new Date();
  const days = ['일','월','화','수','목','금','토'];
  const str = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${days[d.getDay()]})`;
  const el1 = document.getElementById('sidebarDate');
  const el2 = document.getElementById('mobileDate');
  const el3 = document.getElementById('pcHeaderDate');
  if(el1) el1.textContent = str;
  if(el2) el2.textContent = str;
  if(el3) el3.textContent = str;
}

// ===== SIDEBAR STATS =====
function renderSidebarStats() {
  const today = todayStr();
  const todayLogs = db.logs.filter(l => l.date === today);
  document.getElementById('ssStat1').textContent = todayLogs.length;
  document.getElementById('ssStat2').textContent = todayLogs.filter(l=>l.status==='완료').length;
  document.getElementById('ssStat3').textContent = todayLogs.filter(l=>l.status==='이슈').length;
  const {monStr,sunStr} = getWeekDates(0);
  document.getElementById('ssStat4').textContent = db.logs.filter(l=>l.date>=monStr&&l.date<=sunStr).length;
}

// ===== SCREENS =====
function showScreen(name, btn) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');

  // sidebar nav
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.querySelectorAll(`.nav-item[data-screen="${name}"]`).forEach(b => b.classList.add('active'));

  // mobile nav
  document.querySelectorAll('.mobile-nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll(`.mobile-nav-btn[data-screen="${name}"]`).forEach(b => b.classList.add('active'));

  // PC header title
  const titles = {record:'✏️ 업무 기록', items:'📋 항목 관리', report:'📄 주간보고', backup:'💾 백업 / 통계'};
  const el = document.getElementById('pcHeaderTitle');
  if(el) el.textContent = titles[name] || '';

  // FAB only on record (mobile)
  document.getElementById('fabBtn').style.display = name === 'record' ? 'flex' : 'none';

  closeSheet();
  if(name==='report') initReportDates();
  if(name==='backup') renderSummaryStats();
  if(name==='items') renderItemsGrid();
  if(name==='record') { renderStats(); renderLogList(); renderSidebarStats(); }
}

// ===== MOBILE SHEET =====
function toggleSheet() {
  const sheet = document.getElementById('bottomSheet');
  const overlay = document.getElementById('sheetOverlay');
  const fab = document.getElementById('fabBtn');
  const isOpen = sheet.classList.contains('open');
  if (isOpen) { closeSheet(); }
  else {
    sheet.classList.add('open');
    overlay.classList.add('open');
    fab.classList.add('open');
    document.getElementById('mobLogDate').value = todayStr();
    document.getElementById('mobLogMemo').value = '';
  }
}

function closeSheet() {
  document.getElementById('bottomSheet').classList.remove('open');
  document.getElementById('sheetOverlay').classList.remove('open');
  document.getElementById('fabBtn').classList.remove('open');
}

// ===== CATEGORY / STATUS =====
function selectCat(btn, mode) {
  const prefix = mode === 'pc' ? '.col-left .cat-pill' : '.bottom-sheet .cat-pill';
  document.querySelectorAll(prefix).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (mode === 'pc') {
    selectedCatPC = btn.dataset.cat;
    updateItemSelect('pc');
    renderRecentChips('pc');
  } else {
    selectedCatMob = btn.dataset.cat;
    updateItemSelect('mob');
    renderRecentChips('mob');
  }
}

function updateItemSelect(mode) {
  const cat = mode === 'pc' ? selectedCatPC : selectedCatMob;
  const sel = document.getElementById(mode === 'pc' ? 'pcItemSelect' : 'mobItemSelect');
  sel.innerHTML = '';
  if (!cat) { sel.innerHTML = '<option value="">— 분류를 먼저 선택하세요 —</option>'; return; }
  sel.innerHTML = '<option value="">— 항목 선택 —</option>';
  (db.categories[cat] || []).forEach(item => {
    const o = document.createElement('option');
    o.value = item; o.textContent = item;
    sel.appendChild(o);
  });
}

function selectStatus(btn, mode) {
  const prefix = mode === 'pc' ? '.col-left .status-pill' : '.bottom-sheet .status-pill';
  document.querySelectorAll(prefix).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (mode === 'pc') selectedStatusPC = btn.dataset.status;
  else selectedStatusMob = btn.dataset.status;
}

function renderRecentChips(mode) {
  const cat = mode === 'pc' ? selectedCatPC : selectedCatMob;
  const containerId = mode === 'pc' ? 'pcRecentChips' : 'mobRecentChips';
  const container = document.getElementById(containerId);
  if (!cat) { container.innerHTML = ''; return; }
  const recent = db.logs
    .filter(l => l.category === cat)
    .sort((a,b) => b.id - a.id)
    .map(l => l.itemName)
    .filter((v,i,a) => a.indexOf(v)===i)
    .slice(0, 5);
  if (recent.length === 0) { container.innerHTML = ''; return; }
  container.innerHTML = '<div style="font-size:10px;color:var(--text-muted);width:100%;margin-bottom:4px">최근 사용</div>' +
    recent.map(r => `<span class="recent-chip" onclick="quickSelectItem('${r.replace(/'/g,"\\'")}','${mode}')">↩ ${r}</span>`).join('');
}

function quickSelectItem(name, mode) {
  const sel = document.getElementById(mode === 'pc' ? 'pcItemSelect' : 'mobItemSelect');
  for (let o of sel.options) { if (o.value === name) { sel.value = name; return; } }
}

// ===== SAVE LOG =====
function saveLog(mode) {
  const item = document.getElementById(mode==='pc'?'pcItemSelect':'mobItemSelect').value;
  const memo = document.getElementById(mode==='pc'?'pcLogMemo':'mobLogMemo').value.trim();
  const date = document.getElementById(mode==='pc'?'pcLogDate':'mobLogDate').value;
  const cat = mode==='pc' ? selectedCatPC : selectedCatMob;
  const status = mode==='pc' ? selectedStatusPC : selectedStatusMob;

  if (!cat) { showToast('분류를 선택해주세요'); return; }
  if (!item) { showToast('항목을 선택해주세요'); return; }
  if (!memo) { showToast('내용을 입력해주세요'); return; }

  db.logs.unshift({ id: Date.now(), category: cat, itemName: item, status, date, memo });
  saveDB();

  if (mode === 'pc') {
    document.getElementById('pcLogMemo').value = '';
  } else {
    document.getElementById('mobLogMemo').value = '';
    closeSheet();
  }

  renderStats();
  renderLogList();
  renderSidebarStats();
  renderRecentChips(mode);
  showToast('✅ 기록 저장 완료');
}

// ===== STATS =====
function renderStats() {
  const today = todayStr();
  const todayLogs = db.logs.filter(l => l.date === today);
  const total = todayLogs.length;
  const done = todayLogs.filter(l => l.status === '완료').length;
  const issues = todayLogs.filter(l => l.status === '이슈').length;
  const {monStr,sunStr} = getWeekDates(0);
  const weekTotal = db.logs.filter(l=>l.date>=monStr&&l.date<=sunStr).length;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card">
      <div class="stat-num">${total}</div>
      <div class="stat-label">오늘 기록</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" style="color:var(--green)">${done}</div>
      <div class="stat-label">오늘 완료</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" style="color:var(--red)">${issues}</div>
      <div class="stat-label">이슈</div>
    </div>
    <div class="stat-card" style="">
      <div class="stat-num" style="color:var(--blue)">${weekTotal}</div>
      <div class="stat-label">이번 주 합계</div>
    </div>
  `;
}

// ===== LOG LIST =====
function filterLogs(btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentLogFilter = btn.dataset.filter;
  renderLogList();
}

function renderLogList() {
  let logs = [...db.logs];
  if (currentLogFilter !== 'all') {
    if (['루틴업무','프로젝트','자율업무'].includes(currentLogFilter)) {
      logs = logs.filter(l => l.category === currentLogFilter);
    } else {
      logs = logs.filter(l => l.status === currentLogFilter);
    }
  }

  const container = document.getElementById('logList');
  if (logs.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div>기록이 없습니다.</div>`;
    return;
  }

  container.innerHTML = logs.map(log => `
    <div class="log-item" id="logItem-${log.id}">
      <div class="log-left">
        <div class="log-meta">
          <span class="badge badge-${log.category}">${log.category}</span>
          <span class="log-item-name">${log.itemName}</span>
          <span class="badge badge-${log.status}">${log.status}</span>
          <span class="log-date">${log.date}</span>
        </div>
        <div class="log-memo">${escHtml(log.memo)}</div>
      </div>
      <div class="log-actions">
        <button class="log-act-btn" onclick="startEdit(${log.id})" title="수정">✏️</button>
        <button class="log-act-btn del" onclick="deleteLog(${log.id})" title="삭제">🗑</button>
      </div>
    </div>
    <div id="editArea-${log.id}"></div>
  `).join('');
}

function deleteLog(id) {
  if (!confirm('이 기록을 삭제할까요?')) return;
  db.logs = db.logs.filter(l => l.id !== id);
  saveDB();
  renderStats();
  renderLogList();
  renderSidebarStats();
  showToast('삭제 완료');
}

function startEdit(id) {
  if (editingLogId === id) {
    document.getElementById('editArea-'+id).innerHTML = '';
    editingLogId = null;
    return;
  }
  if (editingLogId) { document.getElementById('editArea-'+editingLogId).innerHTML = ''; }
  editingLogId = id;
  const log = db.logs.find(l => l.id === id);
  if (!log) return;

  const statuses = ['진행중','완료','이슈','다음주'];
  const statusOpts = statuses.map(s => `<option value="${s}" ${log.status===s?'selected':''}>${s}</option>`).join('');

  document.getElementById('editArea-'+id).innerHTML = `
    <div class="edit-panel open" style="margin-bottom:8px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div class="form-group" style="margin:0">
          <div class="form-label">상태</div>
          <select id="editStatus-${id}">${statusOpts}</select>
        </div>
        <div class="form-group" style="margin:0">
          <div class="form-label">날짜</div>
          <input type="date" id="editDate-${id}" value="${log.date}">
        </div>
      </div>
      <div class="form-group">
        <div class="form-label">내용</div>
        <textarea id="editMemo-${id}">${log.memo}</textarea>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn-save" style="flex:1" onclick="saveEdit(${id})">저장</button>
        <button class="btn-icon" onclick="startEdit(${id})">취소</button>
      </div>
    </div>
  `;
}

function saveEdit(id) {
  const log = db.logs.find(l => l.id === id);
  if (!log) return;
  log.status = document.getElementById('editStatus-'+id).value;
  log.date = document.getElementById('editDate-'+id).value;
  log.memo = document.getElementById('editMemo-'+id).value.trim();
  saveDB();
  editingLogId = null;
  renderStats();
  renderLogList();
  renderSidebarStats();
  showToast('수정 완료');
}

// ===== ITEM MANAGEMENT (3-column grid) =====
function renderItemsGrid() {
  const cats = ['루틴업무','프로젝트','자율업무'];
  const icons = {'루틴업무':'📌','프로젝트':'🗂','자율업무':'💡'};
  const colors = {'루틴업무':'var(--blue)','프로젝트':'var(--green)','자율업무':'var(--amber)'};

  document.getElementById('itemsGrid').innerHTML = cats.map(cat => {
    const items = db.categories[cat] || [];
    const itemsHtml = items.length === 0
      ? `<div class="empty-state" style="padding:20px"><div class="empty-icon">📂</div>항목을 추가해주세요</div>`
      : items.map((item, idx) => {
          const count = db.logs.filter(l=>l.category===cat&&l.itemName===item).length;
          const safeItem = item.replace(/'/g,"\\'");
          return `<div class="item-list-entry" id="itemEntry-${cat}-${idx}">
            <span class="item-entry-name">${item}</span>
            <span class="item-entry-count">${count}건</span>
            <button class="btn-edit-item" onclick="startEditItem('${cat}',${idx})" title="수정">✏️</button>
            <button class="btn-del-item" onclick="deleteItem('${cat}','${safeItem}',${idx})" title="삭제">✕</button>
          </div>
          <div id="itemEditArea-${cat}-${idx}"></div>`;
        }).join('');

    return `<div class="card">
      <div class="card-title" style="color:${colors[cat]}">${icons[cat]} ${cat}</div>
      <div class="item-add-row">
        <input type="text" id="newItemInput-${cat}" placeholder="새 항목 입력..."
          onkeydown="if(event.key==='Enter')addItem('${cat}')">
        <button class="btn-add" onclick="addItem('${cat}')">+ 추가</button>
      </div>
      <div id="itemListUI-${cat}">${itemsHtml}</div>
    </div>`;
  }).join('');
}

function addItem(cat) {
  const input = document.getElementById('newItemInput-'+cat);
  const name = input.value.trim();
  if (!name) { showToast('항목 이름을 입력해주세요'); return; }
  if (db.categories[cat].includes(name)) { showToast('이미 있는 항목입니다'); return; }
  db.categories[cat].push(name);
  saveDB();
  input.value = '';
  renderItemsGrid();
  showToast('항목 추가 완료');
}

function deleteItem(cat, name, idx) {
  const count = db.logs.filter(l=>l.category===cat&&l.itemName===name).length;
  const msg = count > 0
    ? `"${name}" 항목과 관련 기록 ${count}건이 모두 삭제됩니다. 계속할까요?`
    : `"${name}" 항목을 삭제할까요?`;
  if (!confirm(msg)) return;
  db.categories[cat].splice(idx, 1);
  if (count > 0) db.logs = db.logs.filter(l=>!(l.category===cat&&l.itemName===name));
  saveDB();
  renderItemsGrid();
  showToast('삭제 완료');
}

let editingItem = null;

function startEditItem(cat, idx) {
  if (editingItem) {
    const [ec, ei] = editingItem;
    const area = document.getElementById(`itemEditArea-${ec}-${ei}`);
    const entry = document.getElementById(`itemEntry-${ec}-${ei}`);
    if(area) area.innerHTML = '';
    if(entry) entry.style.display = 'flex';
  }
  if (editingItem && editingItem[0]===cat && editingItem[1]===idx) { editingItem = null; return; }
  editingItem = [cat, idx];
  const current = db.categories[cat][idx];
  const entry = document.getElementById(`itemEntry-${cat}-${idx}`);
  const area = document.getElementById(`itemEditArea-${cat}-${idx}`);
  if(entry) entry.style.display = 'none';
  if(area) area.innerHTML = `
    <div style="display:flex;gap:6px;margin-bottom:6px;align-items:center">
      <input class="item-edit-input" id="itemEditInput-${cat}-${idx}" value="${current}"
        onkeydown="if(event.key==='Enter')saveItemEdit('${cat}',${idx}); if(event.key==='Escape')cancelItemEdit('${cat}',${idx})">
      <button class="btn-add" onclick="saveItemEdit('${cat}',${idx})" style="padding:7px 12px;font-size:12px">저장</button>
      <button class="btn-icon" onclick="cancelItemEdit('${cat}',${idx})" style="padding:7px 10px;font-size:12px">취소</button>
    </div>`;
  const inp = document.getElementById(`itemEditInput-${cat}-${idx}`);
  if(inp) { inp.focus(); inp.select(); }
}

function cancelItemEdit(cat, idx) {
  const area = document.getElementById(`itemEditArea-${cat}-${idx}`);
  const entry = document.getElementById(`itemEntry-${cat}-${idx}`);
  if(area) area.innerHTML = '';
  if(entry) entry.style.display = 'flex';
  editingItem = null;
}

function saveItemEdit(cat, idx) {
  const input = document.getElementById(`itemEditInput-${cat}-${idx}`);
  const newName = input.value.trim();
  const oldName = db.categories[cat][idx];
  if (!newName) { showToast('항목명을 입력해주세요'); return; }
  if (newName === oldName) { cancelItemEdit(cat, idx); return; }
  if (db.categories[cat].includes(newName)) { showToast('이미 있는 항목명입니다'); return; }
  db.categories[cat][idx] = newName;
  db.logs.forEach(l => { if(l.category===cat&&l.itemName===oldName) l.itemName=newName; });
  saveDB();
  editingItem = null;
  renderItemsGrid();
  showToast(`수정 완료`);
}

// ===== REPORT =====
let currentWeekOffset = 0;

function getWeekDates(offset) {
  const d = new Date();
  const day = d.getDay();
  const mon = new Date(d);
  mon.setDate(d.getDate() - (day===0?6:day-1) + offset*7);
  const sun = new Date(mon);
  sun.setDate(mon.getDate()+6);
  return { mon, sun, monStr: fmtDate(mon), sunStr: fmtDate(sun) };
}

function getWeekNumber(date) {
  const firstOfMonth = new Date(date.getFullYear(), date.getMonth(), 1);
  const firstDay = firstOfMonth.getDay() || 7;
  return Math.ceil((date.getDate() + firstDay - 1) / 7);
}

function moveWeek(dir) {
  if (currentWeekOffset + dir > 0) return;
  currentWeekOffset += dir;
  renderReportScreen();
}

function initReportDates() {
  currentWeekOffset = 0;
  renderReportScreen();
}

function renderReportScreen() {
  const { mon, sun, monStr, sunStr } = getWeekDates(currentWeekOffset);
  const weekNum = getWeekNumber(mon);
  const suffix = currentWeekOffset===0?' (이번 주)':currentWeekOffset===-1?' (지난 주)':'';
  document.getElementById('weekLabel').textContent =
    `${mon.getFullYear()}년 ${mon.getMonth()+1}월 ${weekNum}주차${suffix}`;
  document.getElementById('weekRange').textContent =
    `${monStr.slice(5).replace('-','/')} (월) ~ ${sunStr.slice(5).replace('-','/')} (일)`;
  document.getElementById('weekNextBtn').disabled = currentWeekOffset >= 0;

  const logs = db.logs.filter(l => l.date >= monStr && l.date <= sunStr);
  const cats = ['루틴업무','프로젝트','자율업무'];
  const colors = ['var(--blue)','var(--green)','var(--amber)'];
  const icons = ['📌','🗂','💡'];
  document.getElementById('weekSummaryRow').innerHTML = cats.map((cat,i) => {
    const cnt = logs.filter(l=>l.category===cat).length;
    return `<div class="week-sum-card">
      <div class="week-sum-dot" style="background:${colors[i]}"></div>
      <div class="week-sum-info">
        <div class="week-sum-num">${cnt}</div>
        <div class="week-sum-label">${icons[i]} ${cat}</div>
      </div>
    </div>`;
  }).join('');

  generateReport(monStr, sunStr);
}

function generateReport(from, to) {
  const logs = db.logs.filter(l => l.date >= from && l.date <= to);
  if (logs.length === 0) {
    document.getElementById('reportOutput').innerHTML =
      `<div class="empty-state"><div class="empty-icon">📭</div>해당 주에 기록이 없습니다.</div>`;
    window._reportText = '';
    return;
  }

  const byItem = {};
  logs.forEach(log => {
    if (!byItem[log.itemName]) byItem[log.itemName] = { category: log.category, entries: [] };
    byItem[log.itemName].entries.push(log);
  });

  const byCat = {'루틴업무':[],'프로젝트':[],'자율업무':[]};
  Object.entries(byItem).forEach(([item, data]) => {
    byCat[data.category].push({ item, entries: data.entries });
  });

  let reportText = `[주간업무보고] ${from} ~ ${to}\n\n`;
  let htmlOut = '';

  ['루틴업무','프로젝트','자율업무'].forEach(cat => {
    const items = byCat[cat];
    if (items.length === 0) return;
    const iconsMap = {'루틴업무':'📌','프로젝트':'🗂','자율업무':'💡'};
    reportText += `■ ${cat}\n`;
    htmlOut += `<div style="margin-top:14px"><span class="badge badge-${cat}" style="font-size:12px;padding:3px 10px">${iconsMap[cat]} ${cat}</span></div>`;
    items.forEach(({item, entries}) => {
      reportText += `▶ ${item}\n`;
      htmlOut += `<div style="margin:8px 0 4px 4px;font-weight:700;font-size:13px">▶ ${item}</div>`;
      entries.sort((a,b)=>a.date.localeCompare(b.date)).forEach(e => {
        reportText += `  - ${e.date.slice(5).replace('-','/')} [${e.status}] ${e.memo}\n`;
        htmlOut += `<div style="margin-left:16px;margin-bottom:4px;font-size:12px;line-height:1.6">
          <span class="badge badge-${e.status}" style="font-size:10px;margin-right:4px">${e.status}</span>
          <span style="color:var(--text-muted);margin-right:6px">${e.date.slice(5).replace('-','/')}</span>
          ${escHtml(e.memo)}
        </div>`;
      });
      reportText += '\n';
    });
  });

  window._reportText = reportText;
  document.getElementById('reportOutput').innerHTML = htmlOut;
}

function copyReport() {
  if (!window._reportText) { showToast('먼저 보고서를 생성해주세요'); return; }
  navigator.clipboard.writeText(window._reportText).then(() => {
    showToast('📋 보고서가 클립보드에 복사되었습니다');
  }).catch(() => {
    showToast('복사 실패 — 직접 선택해서 복사해주세요');
  });
}

// ===== BACKUP =====
function exportData() {
  const json = JSON.stringify(db, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `법무업무기록_${todayStr().replace(/-/g,'')}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('📤 내보내기 완료');
}

function importData() { document.getElementById('importFile').click(); }

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.categories || !data.logs) throw new Error('invalid');
      if (!confirm('현재 데이터를 덮어씁니다. 계속할까요?')) return;
      db = data;
      saveDB();
      renderStats();
      renderLogList();
      renderItemsGrid();
      renderSummaryStats();
      renderSidebarStats();
      showToast('📥 불러오기 완료');
    } catch(err) { showToast('올바른 백업 파일이 아닙니다'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function renderSummaryStats() {
  const total = db.logs.length;
  const {monStr,sunStr} = getWeekDates(0);
  const thisWeek = db.logs.filter(l=>l.date>=monStr&&l.date<=sunStr).length;
  const catCount = {};
  db.logs.forEach(l => { catCount[l.category] = (catCount[l.category]||0)+1; });
  const itemCount = Object.values(db.categories).reduce((a,b)=>a+b.length, 0);

  document.getElementById('summaryStats').innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px">
      <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">전체 기록</div></div>
      <div class="stat-card"><div class="stat-num">${thisWeek}</div><div class="stat-label">이번 주</div></div>
      <div class="stat-card"><div class="stat-num">${itemCount}</div><div class="stat-label">등록 항목</div></div>
    </div>
    ${['루틴업무','프로젝트','자율업무'].map(cat => `
      <div style="display:flex;align-items:center;margin-bottom:10px">
        <span class="badge badge-${cat}" style="width:72px;justify-content:center;margin-right:10px">${cat}</span>
        <div style="flex:1;background:var(--paper-dark);border-radius:4px;height:8px;overflow:hidden">
          <div style="height:8px;border-radius:4px;background:${cat==='루틴업무'?'var(--blue)':cat==='프로젝트'?'var(--green)':'var(--amber)'};width:${total?(catCount[cat]||0)/total*100:0}%"></div>
        </div>
        <span style="font-size:12px;color:var(--text-muted);margin-left:10px;width:28px;text-align:right">${catCount[cat]||0}</span>
      </div>
    `).join('')}
  `;
}

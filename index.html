<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>법무 업무기록</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1a2844;
    --navy-light: #243356;
    --amber: #c8873c;
    --amber-light: #e8a85a;
    --paper: #f4f2ee;
    --paper-dark: #ebe8e2;
    --white: #ffffff;
    --text: #1e1e2e;
    --text-muted: #6b6b80;
    --border: #d8d4cc;
    --green: #2d7a5f;
    --green-bg: #e8f5ef;
    --red: #b54040;
    --red-bg: #fceaea;
    --blue: #2a5ba0;
    --blue-bg: #e8eef8;
    --orange: #b36a1a;
    --orange-bg: #fdf0e0;
    --shadow: 0 2px 12px rgba(26,40,68,0.10);
    --shadow-lg: 0 8px 32px rgba(26,40,68,0.15);
    --radius: 10px;
    --radius-sm: 6px;
  }

- { box-sizing: border-box; margin: 0; padding: 0; }

body {
font-family: ‘Noto Sans KR’, sans-serif;
background: var(–paper);
color: var(–text);
min-height: 100vh;
display: flex;
flex-direction: column;
}

/* HEADER */
.app-header {
background: var(–navy);
color: white;
padding: 0 24px;
height: 56px;
display: flex;
align-items: center;
justify-content: space-between;
position: sticky;
top: 0;
z-index: 100;
box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}

.app-title {
font-family: ‘DM Serif Display’, serif;
font-size: 18px;
letter-spacing: 0.3px;
color: #e8e0d0;
}

.app-title span {
color: var(–amber-light);
font-family: ‘Noto Sans KR’, sans-serif;
font-size: 11px;
font-weight: 500;
opacity: 0.8;
margin-left: 8px;
letter-spacing: 1px;
text-transform: uppercase;
}

.header-date {
font-size: 12px;
color: rgba(255,255,255,0.55);
font-weight: 300;
}

/* NAV */
.app-nav {
background: var(–white);
border-bottom: 1px solid var(–border);
display: flex;
padding: 0 16px;
position: sticky;
top: 56px;
z-index: 99;
}

.nav-btn {
padding: 14px 18px;
font-size: 13px;
font-weight: 500;
color: var(–text-muted);
background: none;
border: none;
cursor: pointer;
border-bottom: 2.5px solid transparent;
transition: all 0.2s;
font-family: inherit;
white-space: nowrap;
}

.nav-btn:hover { color: var(–text); }
.nav-btn.active {
color: var(–navy);
border-bottom-color: var(–amber);
font-weight: 700;
}

/* MAIN CONTENT */
.app-body {
flex: 1;
max-width: 720px;
width: 100%;
margin: 0 auto;
padding: 24px 16px 40px;
}

/* SCREENS */
.screen { display: none; }
.screen.active { display: block; }

/* SECTION LABEL */
.section-label {
font-size: 10px;
font-weight: 700;
letter-spacing: 1.5px;
text-transform: uppercase;
color: var(–text-muted);
margin-bottom: 8px;
}

/* CARDS */
.card {
background: var(–white);
border: 1px solid var(–border);
border-radius: var(–radius);
padding: 20px;
margin-bottom: 16px;
box-shadow: var(–shadow);
}

.card-title {
font-size: 13px;
font-weight: 700;
color: var(–navy);
margin-bottom: 14px;
display: flex;
align-items: center;
gap: 6px;
}

/* CATEGORY PILL TABS */
.cat-pill-row {
display: flex;
gap: 8px;
margin-bottom: 4px;
}

.cat-pill {
flex: 1;
padding: 10px 6px;
border: 2px solid var(–border);
border-radius: 24px;
background: var(–paper);
cursor: pointer;
font-family: inherit;
font-size: 13px;
font-weight: 600;
color: var(–text-muted);
text-align: center;
transition: all 0.18s;
white-space: nowrap;
}

.cat-pill:hover { border-color: var(–amber); color: var(–amber); background: var(–orange-bg); }

.cat-pill.active[data-cat=“루틴업무”] {
border-color: var(–blue); background: var(–blue); color: white;
}
.cat-pill.active[data-cat=“프로젝트”] {
border-color: var(–green); background: var(–green); color: white;
}
.cat-pill.active[data-cat=“자율업무”] {
border-color: var(–amber); background: var(–amber); color: white;
}

/* STATUS PILL ROW */
.status-pill-row {
display: flex;
gap: 6px;
}

.status-pill {
flex: 1;
padding: 9px 4px;
border: 2px solid var(–border);
border-radius: 24px;
background: var(–paper);
cursor: pointer;
font-family: inherit;
font-size: 12px;
font-weight: 600;
color: var(–text-muted);
text-align: center;
transition: all 0.18s;
display: flex;
align-items: center;
justify-content: center;
gap: 5px;
white-space: nowrap;
}

.status-pill .dot {
width: 7px; height: 7px;
border-radius: 50%;
flex-shrink: 0;
background: var(–border);
transition: background 0.15s;
}

.status-pill:hover { border-color: var(–amber); color: var(–text); }

.status-pill.active[data-status=“진행중”] {
border-color: var(–blue); background: var(–blue-bg); color: var(–blue);
}
.status-pill.active[data-status=“진행중”] .dot { background: var(–blue); }

.status-pill.active[data-status=“완료”] {
border-color: var(–green); background: var(–green-bg); color: var(–green);
}
.status-pill.active[data-status=“완료”] .dot { background: var(–green); }

.status-pill.active[data-status=“이슈”] {
border-color: var(–red); background: var(–red-bg); color: var(–red);
}
.status-pill.active[data-status=“이슈”] .dot { background: var(–red); }

.status-pill.active[data-status=“다음주”] {
border-color: var(–orange); background: var(–orange-bg); color: var(–orange);
}
.status-pill.active[data-status=“다음주”] .dot { background: var(–orange); }

/* FORM ELEMENTS */
.form-group { margin-bottom: 14px; }
.form-label {
font-size: 11px;
font-weight: 700;
color: var(–text-muted);
letter-spacing: 0.8px;
text-transform: uppercase;
margin-bottom: 6px;
display: block;
}

select, input[type=“text”], input[type=“date”], textarea {
width: 100%;
padding: 10px 12px;
font-family: inherit;
font-size: 14px;
border: 1.5px solid var(–border);
border-radius: var(–radius-sm);
background: var(–paper);
color: var(–text);
transition: border-color 0.15s;
outline: none;
-webkit-appearance: none;
}

select:focus, input:focus, textarea:focus {
border-color: var(–amber);
background: white;
}

textarea { resize: vertical; min-height: 80px; line-height: 1.6; }

/* STATUS BADGE STYLES (kept for log list display) */

/* SAVE BUTTON */
.btn-save {
width: 100%;
padding: 13px;
background: var(–navy);
color: white;
border: none;
border-radius: var(–radius-sm);
font-family: inherit;
font-size: 14px;
font-weight: 700;
cursor: pointer;
transition: background 0.15s;
letter-spacing: 0.5px;
}

.btn-save:hover { background: var(–navy-light); }
.btn-save:active { transform: scale(0.99); }

/* ITEM SELECT ROW */
.item-row {
display: flex;
gap: 8px;
}

.item-row select { flex: 1; }

.btn-icon {
padding: 10px 14px;
border: 1.5px solid var(–border);
border-radius: var(–radius-sm);
background: white;
cursor: pointer;
font-size: 16px;
transition: all 0.15s;
white-space: nowrap;
}

.btn-icon:hover { border-color: var(–amber); background: var(–orange-bg); }

/* TODAY’S LOGS */
.log-item {
border: 1px solid var(–border);
border-radius: var(–radius-sm);
padding: 12px 14px;
margin-bottom: 8px;
background: white;
display: flex;
gap: 10px;
align-items: flex-start;
position: relative;
}

.log-left { flex: 1; min-width: 0; }

.log-meta {
display: flex;
align-items: center;
gap: 6px;
margin-bottom: 4px;
flex-wrap: wrap;
}

.log-item-name {
font-size: 13px;
font-weight: 700;
color: var(–text);
}

.log-date {
font-size: 11px;
color: var(–text-muted);
margin-left: auto;
}

.log-memo {
font-size: 13px;
color: var(–text);
line-height: 1.6;
word-break: break-all;
}

.log-actions {
display: flex;
gap: 4px;
opacity: 0;
transition: opacity 0.15s;
}

.log-item:hover .log-actions { opacity: 1; }

.log-act-btn {
width: 28px;
height: 28px;
border: none;
border-radius: 4px;
background: var(–paper-dark);
cursor: pointer;
font-size: 13px;
display: flex;
align-items: center;
justify-content: center;
transition: all 0.15s;
}

.log-act-btn:hover { background: var(–border); }
.log-act-btn.del:hover { background: var(–red-bg); color: var(–red); }

/* STATUS BADGES */
.badge {
display: inline-flex;
align-items: center;
padding: 2px 8px;
border-radius: 20px;
font-size: 11px;
font-weight: 700;
white-space: nowrap;
}

.badge-루틴업무 { background: var(–blue-bg); color: var(–blue); }
.badge-프로젝트 { background: var(–green-bg); color: var(–green); }
.badge-자율업무 { background: var(–orange-bg); color: var(–orange); }
.badge-진행중 { background: var(–blue-bg); color: var(–blue); }
.badge-완료 { background: var(–green-bg); color: var(–green); }
.badge-이슈 { background: var(–red-bg); color: var(–red); }
.badge-다음주 { background: var(–orange-bg); color: var(–orange); }

/* EMPTY STATE */
.empty-state {
text-align: center;
padding: 40px 20px;
color: var(–text-muted);
font-size: 13px;
}
.empty-state .empty-icon { font-size: 32px; margin-bottom: 8px; }

/* ITEM MANAGEMENT */
.cat-tab-row {
display: flex;
gap: 6px;
margin-bottom: 16px;
}

.cat-tab {
padding: 8px 16px;
border: 1.5px solid var(–border);
border-radius: 20px;
background: white;
cursor: pointer;
font-family: inherit;
font-size: 12px;
font-weight: 500;
color: var(–text-muted);
transition: all 0.15s;
}

.cat-tab.active[data-cat=“루틴업무”] { border-color: var(–blue); background: var(–blue-bg); color: var(–blue); font-weight: 700; }
.cat-tab.active[data-cat=“프로젝트”] { border-color: var(–green); background: var(–green-bg); color: var(–green); font-weight: 700; }
.cat-tab.active[data-cat=“자율업무”] { border-color: var(–amber); background: var(–orange-bg); color: var(–orange); font-weight: 700; }

.item-add-row {
display: flex;
gap: 8px;
margin-bottom: 12px;
}

.item-add-row input { flex: 1; }

.btn-add {
padding: 10px 16px;
background: var(–amber);
color: white;
border: none;
border-radius: var(–radius-sm);
font-family: inherit;
font-size: 13px;
font-weight: 700;
cursor: pointer;
white-space: nowrap;
transition: background 0.15s;
}

.btn-add:hover { background: var(–amber-light); }

.item-list-entry {
display: flex;
align-items: center;
padding: 10px 12px;
background: var(–paper);
border-radius: var(–radius-sm);
margin-bottom: 6px;
border: 1px solid var(–border);
}

.item-list-entry .item-entry-name {
flex: 1;
font-size: 13px;
font-weight: 500;
}

.item-edit-input {
flex: 1;
padding: 5px 9px;
font-family: inherit;
font-size: 13px;
border: 1.5px solid var(–amber);
border-radius: var(–radius-sm);
background: white;
color: var(–text);
outline: none;
}

.btn-edit-item {
width: 26px;
height: 26px;
border: none;
border-radius: 4px;
background: none;
cursor: pointer;
font-size: 13px;
color: var(–text-muted);
transition: all 0.15s;
display: flex;
align-items: center;
justify-content: center;
}

.btn-edit-item:hover { background: var(–blue-bg); color: var(–blue); }

.item-entry-count {
font-size: 11px;
color: var(–text-muted);
margin-right: 8px;
}

.btn-del-item {
width: 26px;
height: 26px;
border: none;
border-radius: 4px;
background: none;
cursor: pointer;
font-size: 14px;
color: var(–text-muted);
transition: all 0.15s;
display: flex;
align-items: center;
justify-content: center;
}

.btn-del-item:hover { background: var(–red-bg); color: var(–red); }

/* REPORT */
.report-controls {
display: flex;
gap: 8px;
margin-bottom: 16px;
flex-wrap: wrap;
align-items: center;
}

.report-controls input[type=“date”] { flex: 1; min-width: 130px; }

.btn-gen {
padding: 10px 20px;
background: var(–navy);
color: white;
border: none;
border-radius: var(–radius-sm);
font-family: inherit;
font-size: 13px;
font-weight: 700;
cursor: pointer;
white-space: nowrap;
transition: background 0.15s;
}

.btn-gen:hover { background: var(–navy-light); }

.report-output {
background: white;
border: 1.5px solid var(–border);
border-radius: var(–radius);
padding: 20px;
min-height: 200px;
font-size: 13px;
line-height: 1.8;
white-space: pre-wrap;
color: var(–text);
position: relative;
}

.btn-copy {
position: absolute;
top: 12px;
right: 12px;
padding: 6px 14px;
background: var(–paper);
border: 1px solid var(–border);
border-radius: var(–radius-sm);
font-family: inherit;
font-size: 12px;
font-weight: 600;
cursor: pointer;
transition: all 0.15s;
color: var(–text-muted);
}

.btn-copy:hover { background: var(–navy); color: white; border-color: var(–navy); }

.report-section-title {
font-weight: 700;
color: var(–navy);
margin-bottom: 4px;
}

/* BACKUP */
.backup-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 12px;
}

.backup-card {
background: white;
border: 1.5px solid var(–border);
border-radius: var(–radius);
padding: 20px;
text-align: center;
cursor: pointer;
transition: all 0.18s;
}

.backup-card:hover { border-color: var(–amber); box-shadow: var(–shadow); }

.backup-icon { font-size: 32px; margin-bottom: 8px; }
.backup-title { font-size: 14px; font-weight: 700; color: var(–navy); margin-bottom: 4px; }
.backup-desc { font-size: 11px; color: var(–text-muted); line-height: 1.5; }

/* MODAL / INLINE EDIT */
.edit-panel {
display: none;
background: white;
border: 1.5px solid var(–amber);
border-radius: var(–radius);
padding: 16px;
margin-top: 8px;
box-shadow: var(–shadow);
}

.edit-panel.open { display: block; }

/* DIVIDER */
.divider {
height: 1px;
background: var(–border);
margin: 16px 0;
}

/* TOAST */
.toast {
position: fixed;
bottom: 24px;
left: 50%;
transform: translateX(-50%) translateY(100px);
background: var(–navy);
color: white;
padding: 10px 22px;
border-radius: 24px;
font-size: 13px;
font-weight: 500;
z-index: 999;
transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
white-space: nowrap;
box-shadow: var(–shadow-lg);
}

.toast.show { transform: translateX(-50%) translateY(0); }

/* RECENT ITEMS */
.recent-items {
display: flex;
flex-wrap: wrap;
gap: 6px;
margin-top: 8px;
}

.recent-chip {
padding: 5px 11px;
border: 1px solid var(–border);
border-radius: 14px;
background: white;
font-size: 11px;
font-weight: 500;
color: var(–text);
cursor: pointer;
transition: all 0.15s;
}

.recent-chip:hover { border-color: var(–amber); color: var(–amber); background: var(–orange-bg); }

/* STATS ROW */
.stats-row {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 8px;
margin-bottom: 16px;
}

.stat-card {
background: white;
border: 1px solid var(–border);
border-radius: var(–radius-sm);
padding: 12px;
text-align: center;
}

.stat-num { font-size: 22px; font-weight: 700; color: var(–navy); }
.stat-label { font-size: 10px; color: var(–text-muted); margin-top: 2px; font-weight: 500; }

/* FILTER ROW */
.filter-row {
display: flex;
gap: 6px;
margin-bottom: 12px;
flex-wrap: wrap;
}

.filter-btn {
padding: 5px 12px;
border: 1px solid var(–border);
border-radius: 14px;
background: white;
font-family: inherit;
font-size: 11px;
font-weight: 500;
color: var(–text-muted);
cursor: pointer;
transition: all 0.15s;
}

.filter-btn.active { background: var(–navy); color: white; border-color: var(–navy); }

/* WEEK NAVIGATOR */
.week-nav-card {
background: var(–navy);
border-radius: var(–radius);
padding: 16px 20px;
display: flex;
align-items: center;
gap: 12px;
margin-bottom: 12px;
box-shadow: var(–shadow-lg);
}

.week-arrow {
width: 36px;
height: 36px;
border: 1.5px solid rgba(255,255,255,0.25);
border-radius: 8px;
background: rgba(255,255,255,0.08);
color: white;
font-size: 18px;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
transition: all 0.15s;
flex-shrink: 0;
}

.week-arrow:hover:not(:disabled) { background: rgba(255,255,255,0.18); }
.week-arrow:disabled { opacity: 0.3; cursor: not-allowed; }

.week-nav-center {
flex: 1;
text-align: center;
}

.week-label {
font-size: 16px;
font-weight: 700;
color: white;
letter-spacing: 0.3px;
margin-bottom: 2px;
}

.week-range {
font-size: 11px;
color: rgba(255,255,255,0.55);
}

/* WEEK SUMMARY */
.week-summary-row {
display: grid;
grid-template-columns: repeat(3, 1fr);
gap: 8px;
margin-bottom: 12px;
}

.week-sum-card {
background: white;
border: 1px solid var(–border);
border-radius: var(–radius-sm);
padding: 10px 12px;
display: flex;
align-items: center;
gap: 8px;
}

.week-sum-dot {
width: 8px;
height: 8px;
border-radius: 50%;
flex-shrink: 0;
}

.week-sum-info { min-width: 0; }
.week-sum-num { font-size: 18px; font-weight: 700; color: var(–navy); line-height: 1.1; }
.week-sum-label { font-size: 10px; color: var(–text-muted); white-space: nowrap; }

/* FAB */
.fab {
position: fixed;
bottom: 28px;
right: 22px;
width: 56px;
height: 56px;
border-radius: 50%;
background: var(–amber);
color: white;
font-size: 28px;
font-weight: 300;
border: none;
cursor: pointer;
box-shadow: 0 4px 20px rgba(200,135,60,0.45);
display: flex;
align-items: center;
justify-content: center;
transition: transform 0.2s, background 0.15s;
z-index: 200;
line-height: 1;
}
.fab:hover { background: var(–amber-light); transform: scale(1.07); }
.fab.open { transform: rotate(45deg); background: var(–text-muted); box-shadow: 0 4px 16px rgba(0,0,0,0.2); }

/* BOTTOM SHEET OVERLAY */
.sheet-overlay {
display: none;
position: fixed;
inset: 0;
background: rgba(10,16,30,0.45);
z-index: 210;
animation: fadeIn 0.2s ease;
}
.sheet-overlay.open { display: block; }

@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

/* BOTTOM SHEET */
.bottom-sheet {
position: fixed;
bottom: 0; left: 0; right: 0;
background: var(–white);
border-radius: 20px 20px 0 0;
padding: 0 20px 32px;
max-height: 88vh;
overflow-y: auto;
z-index: 220;
display: none;
animation: slideUp 0.28s cubic-bezier(0.32, 0.72, 0, 1);
box-shadow: 0 -4px 32px rgba(26,40,68,0.18);
}
.bottom-sheet.open { display: block; }

.sheet-handle {
width: 40px;
height: 4px;
background: var(–border);
border-radius: 2px;
margin: 12px auto 16px;
}

.sheet-title {
font-size: 16px;
font-weight: 700;
color: var(–navy);
margin-bottom: 18px;
text-align: center;
}

/* RECORD SCREEN TOP */
.record-top {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 10px;
}

@media (max-width: 500px) {
.cat-grid { grid-template-columns: 1fr 1fr 1fr; }
.status-grid { grid-template-columns: repeat(2, 1fr); }
.backup-grid { grid-template-columns: 1fr; }
.stats-row { grid-template-columns: repeat(3, 1fr); }
.nav-btn { padding: 14px 12px; font-size: 12px; }
.week-summary-row { grid-template-columns: repeat(3, 1fr); }
}
</style>

</head>
<body>

<div class="app-header">
  <div class="app-title">법무 업무기록 <span>Legal Work Log</span></div>
  <div class="header-date" id="headerDate"></div>
</div>

<nav class="app-nav">
  <button class="nav-btn active" onclick="showScreen('record', this)">✏️ 기록</button>

<script>
// ===== DATA =====
let db = {
  categories: {
    "루틴업무": ["NDA 검토", "공급계약 검토", "인사노무 자문", "표시광고 검토"],
    "프로젝트": ["컴플라이언스 점검체계 구축", "내부통제 고도화"],
    "자율업무": ["AI 법무 자동화 정리", "표준계약서 리뉴얼", "법무 KPI 설계"]
  },
  logs: []
};

let selectedCat = null;
let selectedStatus = '완료';
let currentLogFilter = 'all';
let currentItemTab = '루틴업무';
let editingLogId = null;

// ===== LOAD / SAVE =====
function loadDB() {
  const raw = localStorage.getItem('legalWorkLog_v1');
  if (raw) {
    try { db = JSON.parse(raw); } catch(e) {}
  }
}

function saveDB() {
  localStorage.setItem('legalWorkLog_v1', JSON.stringify(db));
}

// ===== INIT =====
function init() {
  loadDB();
  setTodayDate();
  updateHeaderDate();
  renderStats();
  renderLogList();
  renderItemList();
  initReportDates();
  renderSummaryStats();
}

function setTodayDate() {
  document.getElementById('logDate').value = todayStr();
}

function todayStr() {
  return new Date().toISOString().split('T')[0];
}

function updateHeaderDate() {
  const d = new Date();
  const days = ['일','월','화','수','목','금','토'];
  document.getElementById('headerDate').textContent =
    `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${days[d.getDay()]})`;
}

// ===== BOTTOM SHEET =====
function toggleSheet() {
  const sheet = document.getElementById('bottomSheet');
  const overlay = document.getElementById('sheetOverlay');
  const fab = document.getElementById('fabBtn');
  const isOpen = sheet.classList.contains('open');
  if (isOpen) {
    closeSheet();
  } else {
    sheet.classList.add('open');
    overlay.classList.add('open');
    fab.classList.add('open');
    // Reset form
    setTodayDate();
    document.getElementById('logMemo').value = '';
  }
}

function closeSheet() {
  document.getElementById('bottomSheet').classList.remove('open');
  document.getElementById('sheetOverlay').classList.remove('open');
  document.getElementById('fabBtn').classList.remove('open');
}

// Only show FAB on record screen
function updateFabVisibility(screen) {
  document.getElementById('fabBtn').style.display = screen === 'record' ? 'flex' : 'none';
}

// ===== SCREENS =====
function showScreen(name, btn) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  if (btn) btn.classList.add('active');
  updateFabVisibility(name);
  closeSheet();
  if(name==='report') initReportDates();
  if(name==='backup') renderSummaryStats();
  if(name==='items') renderItemList();
  if(name==='record') { renderStats(); renderLogList(); }
}

// ===== CATEGORY =====
function selectCat(btn) {
  document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedCat = btn.dataset.cat;
  updateItemSelect();
  renderRecentChips();
}

function updateItemSelect() {
  const sel = document.getElementById('itemSelect');
  sel.innerHTML = '';
  if (!selectedCat) {
    sel.innerHTML = '<option value="">— 분류를 먼저 선택하세요 —</option>';
    return;
  }
  sel.innerHTML = '<option value="">— 항목 선택 —</option>';
  (db.categories[selectedCat] || []).forEach(item => {
    const o = document.createElement('option');
    o.value = item; o.textContent = item;
    sel.appendChild(o);
  });
}

// ===== STATUS =====
function selectStatus(btn) {
  document.querySelectorAll('.status-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedStatus = btn.dataset.status;
}

// ===== RECENT CHIPS =====
function renderRecentChips() {
  if (!selectedCat) return;
  const container = document.getElementById('recentChips');
  // Get recently used items in this category
  const recent = db.logs
    .filter(l => l.category === selectedCat)
    .sort((a,b) => b.id - a.id)
    .map(l => l.itemName)
    .filter((v,i,a) => a.indexOf(v)===i)
    .slice(0, 5);

  if (recent.length === 0) { container.innerHTML = ''; return; }
  container.innerHTML = '<div style="font-size:10px;color:var(--text-muted);width:100%;margin-bottom:4px">최근 사용</div>' +
    recent.map(r => `<span class="recent-chip" onclick="quickSelectItem('${r.replace(/'/g,"\\'")}')">↩ ${r}</span>`).join('');
}

function quickSelectItem(name) {
  const sel = document.getElementById('itemSelect');
  for (let o of sel.options) {
    if (o.value === name) { sel.value = name; return; }
  }
}

// ===== SAVE LOG =====
function saveLog() {
  const item = document.getElementById('itemSelect').value;
  const memo = document.getElementById('logMemo').value.trim();
  const date = document.getElementById('logDate').value;

  if (!selectedCat) { showToast('분류를 선택해주세요'); return; }
  if (!item) { showToast('항목을 선택해주세요'); return; }
  if (!memo) { showToast('내용을 입력해주세요'); return; }

  const log = {
    id: Date.now(),
    category: selectedCat,
    itemName: item,
    status: selectedStatus,
    date: date,
    memo: memo
  };

  db.logs.unshift(log);
  saveDB();
  document.getElementById('logMemo').value = '';
  closeSheet();
  renderStats();
  renderLogList();
  renderRecentChips();
  showToast('✅ 기록 저장 완료');
}

// ===== STATS =====
function renderStats() {
  const today = todayStr();
  const todayLogs = db.logs.filter(l => l.date === today);
  const total = todayLogs.length;
  const done = todayLogs.filter(l => l.status === '완료').length;
  const issues = todayLogs.filter(l => l.status === '이슈').length;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card">
      <div class="stat-num">${total}</div>
      <div class="stat-label">오늘 기록</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" style="color:var(--green)">${done}</div>
      <div class="stat-label">완료</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" style="color:var(--red)">${issues}</div>
      <div class="stat-label">이슈</div>
    </div>
  `;
}

// ===== LOG LIST =====
function filterLogs(btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentLogFilter = btn.dataset.filter;
  renderLogList();
}

function renderLogList() {
  let logs = [...db.logs];

  if (currentLogFilter !== 'all') {
    if (['루틴업무','프로젝트','자율업무'].includes(currentLogFilter)) {
      logs = logs.filter(l => l.category === currentLogFilter);
    } else {
      logs = logs.filter(l => l.status === currentLogFilter);
    }
  }

  const container = document.getElementById('logList');

  if (logs.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div>기록이 없습니다.</div>`;
    return;
  }

  container.innerHTML = logs.map(log => `
    <div class="log-item" id="logItem-${log.id}">
      <div class="log-left">
        <div class="log-meta">
          <span class="badge badge-${log.category}" style="font-size:10px">${log.category}</span>
          <span class="log-item-name">${log.itemName}</span>
          <span class="badge badge-${log.status}">${log.status}</span>
          <span class="log-date">${log.date}</span>
        </div>
        <div class="log-memo">${escHtml(log.memo)}</div>
      </div>
      <div class="log-actions">
        <button class="log-act-btn" onclick="startEdit(${log.id})" title="수정">✏️</button>
        <button class="log-act-btn del" onclick="deleteLog(${log.id})" title="삭제">🗑</button>
      </div>
    </div>
    <div id="editArea-${log.id}"></div>
  `).join('');
}

function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function deleteLog(id) {
  if (!confirm('이 기록을 삭제할까요?')) return;
  db.logs = db.logs.filter(l => l.id !== id);
  saveDB();
  renderStats();
  renderLogList();
  showToast('삭제 완료');
}

function startEdit(id) {
  if (editingLogId === id) {
    document.getElementById('editArea-'+id).innerHTML = '';
    editingLogId = null;
    return;
  }
  if (editingLogId) {
    document.getElementById('editArea-'+editingLogId).innerHTML = '';
  }
  editingLogId = id;
  const log = db.logs.find(l => l.id === id);
  if (!log) return;

  const statuses = ['진행중','완료','이슈','다음주'];
  const statusOpts = statuses.map(s => `<option value="${s}" ${log.status===s?'selected':''}>${s}</option>`).join('');

  document.getElementById('editArea-'+id).innerHTML = `
    <div class="edit-panel open" style="margin-bottom:8px">
      <div class="form-group">
        <div class="form-label">상태</div>
        <select id="editStatus-${id}">${statusOpts}</select>
      </div>
      <div class="form-group">
        <div class="form-label">날짜</div>
        <input type="date" id="editDate-${id}" value="${log.date}">
      </div>
      <div class="form-group">
        <div class="form-label">내용</div>
        <textarea id="editMemo-${id}">${log.memo}</textarea>

```
  </div>
  <div style="display:flex;gap:8px">
    <button class="btn-save" style="flex:1" onclick="saveEdit(${id})">저장</button>
    <button class="btn-icon" onclick="startEdit(${id})">취소</button>
  </div>
</div>
```

`;
}

function saveEdit(id) {
const log = db.logs.find(l => l.id === id);
if (!log) return;
log.status = document.getElementById(‘editStatus-’+id).value;
log.date = document.getElementById(‘editDate-’+id).value;
log.memo = document.getElementById(‘editMemo-’+id).value.trim();
saveDB();
editingLogId = null;
renderStats();
renderLogList();
showToast(‘수정 완료’);
}

// ===== ITEM MANAGEMENT =====
function switchItemTab(btn) {
document.querySelectorAll(’.cat-tab’).forEach(b => b.classList.remove(‘active’));
btn.classList.add(‘active’);
currentItemTab = btn.dataset.cat;
renderItemList();
}

function renderItemList() {
const cat = currentItemTab;
const items = db.categories[cat] || [];
const icons = {‘루틴업무’:‘📌’,‘프로젝트’:‘🗂’,‘자율업무’:‘💡’};
document.getElementById(‘itemTabTitle’).textContent = `${icons[cat]} ${cat} 항목`;

const container = document.getElementById(‘itemListUI’);
if (items.length === 0) {
container.innerHTML = `<div class="empty-state" style="padding:20px"><div class="empty-icon">📂</div>항목을 추가해주세요</div>`;
return;
}

container.innerHTML = items.map((item, idx) => {
const count = db.logs.filter(l => l.category === cat && l.itemName === item).length;
const safeItem = item.replace(/’/g, “\’”);
return `<div class="item-list-entry" id="itemEntry-${idx}"> <span class="item-entry-name" id="itemName-${idx}">${item}</span> <span class="item-entry-count" id="itemCount-${idx}">기록 ${count}건</span> <button class="btn-edit-item" onclick="startEditItem(${idx})" title="수정">✏️</button> <button class="btn-del-item" onclick="deleteItem('${safeItem}', ${idx})" title="삭제">✕</button> </div> <div id="itemEditArea-${idx}"></div>`;
}).join(’’);
}

let editingItemIdx = null;

function startEditItem(idx) {
// Close any open edit
if (editingItemIdx !== null) {
document.getElementById(‘itemEditArea-’ + editingItemIdx).innerHTML = ‘’;
document.getElementById(‘itemEntry-’ + editingItemIdx).style.display = ‘flex’;
}
if (editingItemIdx === idx) { editingItemIdx = null; return; }
editingItemIdx = idx;

const cat = currentItemTab;
const current = db.categories[cat][idx];
document.getElementById(‘itemEntry-’ + idx).style.display = ‘none’;
document.getElementById(‘itemEditArea-’ + idx).innerHTML = `<div style="display:flex;gap:6px;margin-bottom:6px;align-items:center"> <input class="item-edit-input" id="itemEditInput-${idx}" value="${current}" placeholder="항목명 수정..." onkeydown="if(event.key==='Enter')saveItemEdit(${idx}); if(event.key==='Escape')cancelItemEdit(${idx})"> <button class="btn-add" onclick="saveItemEdit(${idx})" style="padding:7px 12px;font-size:12px">저장</button> <button class="btn-icon" onclick="cancelItemEdit(${idx})" style="padding:7px 10px;font-size:12px">취소</button> </div>`;
document.getElementById(‘itemEditInput-’ + idx).focus();
document.getElementById(‘itemEditInput-’ + idx).select();
}

function cancelItemEdit(idx) {
document.getElementById(‘itemEditArea-’ + idx).innerHTML = ‘’;
document.getElementById(‘itemEntry-’ + idx).style.display = ‘flex’;
editingItemIdx = null;
}

function saveItemEdit(idx) {
const cat = currentItemTab;
const input = document.getElementById(‘itemEditInput-’ + idx);
const newName = input.value.trim();
const oldName = db.categories[cat][idx];

if (!newName) { showToast(‘항목명을 입력해주세요’); return; }
if (newName === oldName) { cancelItemEdit(idx); return; }
if (db.categories[cat].includes(newName)) { showToast(‘이미 있는 항목명입니다’); return; }

// Update category list
db.categories[cat][idx] = newName;
// Update all logs referencing old name
db.logs.forEach(l => {
if (l.category === cat && l.itemName === oldName) l.itemName = newName;
});
saveDB();
editingItemIdx = null;
renderItemList();
showToast(`"${oldName}" → "${newName}" 수정 완료`);
}

function addItem() {
const input = document.getElementById(‘newItemInput’);
const name = input.value.trim();
if (!name) { showToast(‘항목 이름을 입력해주세요’); return; }
if (db.categories[currentItemTab].includes(name)) { showToast(‘이미 있는 항목입니다’); return; }
db.categories[currentItemTab].push(name);
saveDB();
input.value = ‘’;
renderItemList();
showToast(‘항목 추가 완료’);
}

function deleteItem(name, idx) {
const cat = currentItemTab;
const count = db.logs.filter(l => l.category === cat && l.itemName === name).length;
const msg = count > 0
? `"${name}" 항목과 관련 기록 ${count}건이 모두 삭제됩니다. 계속할까요?`
: `"${name}" 항목을 삭제할까요?`;
if (!confirm(msg)) return;
db.categories[cat].splice(idx, 1);
if (count > 0) db.logs = db.logs.filter(l => !(l.category === cat && l.itemName === name));
saveDB();
editingItemIdx = null;
renderItemList();
showToast(‘삭제 완료’);
}

// ===== REPORT (WEEK NAVIGATION) =====
let currentWeekOffset = 0;

function fmtDate(d) { return d.toISOString().split(‘T’)[0]; }

function getWeekDates(offset) {
const d = new Date();
const day = d.getDay();
const mon = new Date(d);
mon.setDate(d.getDate() - (day === 0 ? 6 : day - 1) + offset * 7);
const sun = new Date(mon);
sun.setDate(mon.getDate() + 6);
return { mon, sun, monStr: fmtDate(mon), sunStr: fmtDate(sun) };
}

function getWeekNumber(date) {
const firstOfMonth = new Date(date.getFullYear(), date.getMonth(), 1);
const firstDay = firstOfMonth.getDay() || 7;
return Math.ceil((date.getDate() + firstDay - 1) / 7);
}

function moveWeek(dir) {
if (currentWeekOffset + dir > 0) return;
currentWeekOffset += dir;
renderReportScreen();
}

function initReportDates() {
currentWeekOffset = 0;
renderReportScreen();
}

function renderReportScreen() {
const { mon, sun, monStr, sunStr } = getWeekDates(currentWeekOffset);
const weekNum = getWeekNumber(mon);
const suffix = currentWeekOffset === 0 ? ’ (이번 주)’ : currentWeekOffset === -1 ? ’ (지난 주)’ : ‘’;
document.getElementById(‘weekLabel’).textContent =
`${mon.getFullYear()}년 ${mon.getMonth()+1}월 ${weekNum}주차${suffix}`;
document.getElementById(‘weekRange’).textContent =
`${monStr.slice(5).replace('-','/')} (월) ~ ${sunStr.slice(5).replace('-','/')} (일)`;
document.getElementById(‘weekNextBtn’).disabled = currentWeekOffset >= 0;

// Summary row
const logs = db.logs.filter(l => l.date >= monStr && l.date <= sunStr);
const cats = [‘루틴업무’,‘프로젝트’,‘자율업무’];
const colors = [‘var(–blue)’,‘var(–green)’,‘var(–amber)’];
const icons = [‘📌’,‘🗂’,‘💡’];
document.getElementById(‘weekSummaryRow’).innerHTML = cats.map((cat, i) => {
const cnt = logs.filter(l => l.category === cat).length;
return `<div class="week-sum-card"> <div class="week-sum-dot" style="background:${colors[i]}"></div> <div class="week-sum-info"> <div class="week-sum-num">${cnt}</div> <div class="week-sum-label">${icons[i]} ${cat}</div> </div> </div>`;
}).join(’’);

generateReport(monStr, sunStr);
}

function generateReport(from, to) {
const logs = db.logs.filter(l => l.date >= from && l.date <= to);
if (logs.length === 0) {
document.getElementById(‘reportOutput’).innerHTML =
`<div class="empty-state"><div class="empty-icon">📭</div>해당 주에 기록이 없습니다.</div>`;
window._reportText = ‘’;
return;
}

const byItem = {};
logs.forEach(log => {
if (!byItem[log.itemName]) byItem[log.itemName] = { category: log.category, entries: [] };
byItem[log.itemName].entries.push(log);
});

const byCat = { ‘루틴업무’: [], ‘프로젝트’: [], ‘자율업무’: [] };
Object.entries(byItem).forEach(([item, data]) => {
byCat[data.category].push({ item, entries: data.entries });
});

let reportText = `[주간업무보고] ${from} ~ ${to}\n\n`;
let htmlOut = ‘’;

[‘루틴업무’,‘프로젝트’,‘자율업무’].forEach(cat => {
const items = byCat[cat];
if (items.length === 0) return;
const iconsMap = {‘루틴업무’:‘📌’,‘프로젝트’:‘🗂’,‘자율업무’:‘💡’};
reportText += `■ ${cat}\n`;
htmlOut += `<div style="margin-top:14px"><span class="badge badge-${cat}" style="font-size:12px;padding:3px 10px">${iconsMap[cat]} ${cat}</span></div>`;
items.forEach(({ item, entries }) => {
reportText += `▶ ${item}\n`;
htmlOut += `<div style="margin:8px 0 4px 4px;font-weight:700;font-size:13px">▶ ${item}</div>`;
entries.sort((a,b) => a.date.localeCompare(b.date)).forEach(e => {
reportText += `  - ${e.date.slice(5).replace('-','/')} [${e.status}] ${e.memo}\n`;
htmlOut += `<div style="margin-left:16px;margin-bottom:4px;font-size:12px;line-height:1.6"> <span class="badge badge-${e.status}" style="font-size:10px;margin-right:4px">${e.status}</span> <span style="color:var(--text-muted);margin-right:6px">${e.date.slice(5).replace('-','/')}</span> ${escHtml(e.memo)} </div>`;
});
reportText += ‘\n’;
});
});

window._reportText = reportText;
document.getElementById(‘reportOutput’).innerHTML = htmlOut;
}

function copyReport() {
if (!window._reportText) { showToast(‘먼저 보고서를 생성해주세요’); return; }
navigator.clipboard.writeText(window._reportText).then(() => {
showToast(‘📋 보고서가 클립보드에 복사되었습니다’);
}).catch(() => {
showToast(‘복사 실패 — 직접 선택해서 복사해주세요’);
});
}

// ===== BACKUP =====
function exportData() {
const json = JSON.stringify(db, null, 2);
const blob = new Blob([json], { type: ‘application/json’ });
const url = URL.createObjectURL(blob);
const a = document.createElement(‘a’);
const today = todayStr().replace(/-/g,’’);
a.href = url;
a.download = `법무업무기록_${today}.json`;
a.click();
URL.revokeObjectURL(url);
showToast(‘📤 내보내기 완료’);
}

function importData() {
document.getElementById(‘importFile’).click();
}

function handleImport(e) {
const file = e.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = (ev) => {
try {
const data = JSON.parse(ev.target.result);
if (!data.categories || !data.logs) throw new Error(‘invalid’);
if (!confirm(‘현재 데이터를 덮어씁니다. 계속할까요?’)) return;
db = data;
saveDB();
renderStats();
renderLogList();
renderItemList();
renderSummaryStats();
showToast(‘📥 불러오기 완료’);
} catch(err) {
showToast(‘올바른 백업 파일이 아닙니다’);
}
};
reader.readAsText(file);
e.target.value = ‘’;
}

function renderSummaryStats() {
const total = db.logs.length;
const thisWeek = (() => {
const {monStr, sunStr} = getWeekDates(0);
return db.logs.filter(l => l.date >= monStr && l.date <= sunStr).length;
})();

const catCount = {};
db.logs.forEach(l => { catCount[l.category] = (catCount[l.category]||0)+1; });

const itemCount = Object.values(db.categories).reduce((a,b)=>a+b.length, 0);

document.getElementById(‘summaryStats’).innerHTML = `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"> <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">전체 기록</div></div> <div class="stat-card"><div class="stat-num">${thisWeek}</div><div class="stat-label">이번 주</div></div> <div class="stat-card"><div class="stat-num">${itemCount}</div><div class="stat-label">등록 항목</div></div> </div> <div style="margin-top:12px"> ${['루틴업무','프로젝트','자율업무'].map(cat =>`
<div style="display:flex;align-items:center;margin-bottom:8px">
<span class="badge badge-${cat}" style="width:72px;justify-content:center;margin-right:8px">${cat}</span>
<div style="flex:1;background:var(--paper-dark);border-radius:4px;height:8px;overflow:hidden">
<div style="height:8px;border-radius:4px;background:${cat==='루틴업무'?'var(--blue)':cat==='프로젝트'?'var(--green)':'var(--amber)'};width:${total?(catCount[cat]||0)/total*100:0}%"></div>
</div>
<span style="font-size:12px;color:var(--text-muted);margin-left:8px;width:24px;text-align:right">${catCount[cat]||0}</span>
</div>
`).join('')} </div> `;
}

// ===== TOAST =====
function showToast(msg) {
const t = document.getElementById(‘toast’);
t.textContent = msg;
t.classList.add(‘show’);
setTimeout(() => t.classList.remove(‘show’), 2200);
}

// ===== START =====
init();
</script>
